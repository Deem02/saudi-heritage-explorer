# Workflow name shown in the GitHub Actions tab
name: Deploy Juthor

# Run automatically on every push to main
on:
  push:
    branches:
      - main

# Read-only access to the repo is enough for this workflow
permissions:
  contents: read

# Docker Hub image name, reused in both jobs
env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/juthor

jobs:
  # Job 1: build the image and push it to Docker Hub
  build:
    name: Build and push image
    runs-on: ubuntu-latest

    steps:
      # Download the project code into the runner
      - name: Checkout source code
        uses: actions/checkout@v4

      # Login to Docker Hub using secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build from the Dockerfile and push two tags:
      # latest (convenience) and the commit SHA (exact version for deploy/rollback)
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  # Job 2: update the container on the Ubuntu server
  deploy:
    name: Deploy to Ubuntu server
    # Only starts if the build job succeeded
    needs: build
    runs-on: ubuntu-latest

    # Prevent two deployments from running at the same time
    concurrency:
      group: production
      cancel-in-progress: false

    steps:
      # Connect to the server over SSH and run the script below
      - name: Deploy to Ubuntu server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            # Stop the script immediately if any command fails
            set -e

            IMAGE_REPO="${{ env.IMAGE_NAME }}"
            IMAGE="$IMAGE_REPO:${{ github.sha }}"
            CONTAINER_NAME="${{ secrets.CONTAINER_NAME }}"
            APP_PORT="${{ secrets.APP_PORT }}"

            # Pull the exact version built in this run
            docker pull "$IMAGE"

            # Remove the old container if it exists
            if docker ps -a --format '{{.Names}}' | grep -qx "$CONTAINER_NAME"; then
              docker rm -f "$CONTAINER_NAME"
            fi

            # Run the new container: host port -> Nginx port 80 inside the container
            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p "$APP_PORT:80" \
              "$IMAGE"

            # Clean up older versions of this image only (not other projects)
            docker images "$IMAGE_REPO" --format '{{.Repository}}:{{.Tag}}' \
              | grep -v ":${{ github.sha }}$" \
              | xargs -r docker rmi 2>/dev/null || true