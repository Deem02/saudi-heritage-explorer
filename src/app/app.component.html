<header class="site-header">
  <div class="container site-header__inner">
    <span class="brand">جذور</span>
    <nav class="site-nav" aria-label="روابط الصفحة">
      <a href="#explore">استكشف</a>
      <a href="#featured">مختارات</a>
      <a href="#regions">المناطق</a>
    </nav>
  </div>
</header>

<main>
  <app-hero />
  <app-explore
    [activeCategory]="activeCategory"
    (categorySelected)="onCategorySelected($event)"
  />
  <app-featured id="featured" [activeCategory]="activeCategory" />
  <app-regions id="regions" />
  <app-closing />
</main>

<footer class="site-footer">
  <div class="container site-footer__inner">
    <span class="brand brand--small">جذور</span>
    <p>حكاياتٌ من أرضٍ عريقة، امتدت من جيلٍ إلى جيل.</p>
  </div>
</footer>
