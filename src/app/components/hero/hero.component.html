<section class="hero" aria-label="مقدمة جذور">
  <div class="hero__media" aria-hidden="true">
    <img
      src="assets/images/heritage/hero-alula.jpeg"
      alt=""
      class="hero__image"
      loading="eager"
    />
    <div class="hero__pattern"></div>
  </div>

  <div class="container hero__content">
    <div class="hero__panel glass-panel-dark">
      <p class="hero__eyebrow">منصة رقمية للتراث السعودي</p>
      <h1 class="hero__title">جذور</h1>
      <p class="hero__subtitle">
        حكاياتٌ من أرضٍ عريقة، امتدت من جيلٍ إلى جيل.
      </p>
      <button type="button" class="btn btn-primary hero__cta" (click)="scrollToExplore()">
        استكشف جذورنا
        <span aria-hidden="true">←</span>
      </button>
    </div>
  </div>
</section>
