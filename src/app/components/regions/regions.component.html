<section class="section regions" aria-labelledby="regions-heading">
  <div class="container">
    <div class="section-heading">
      <span class="eyebrow">جغرافيا</span>
      <h2 id="regions-heading">مناطق المملكة</h2>
      <p>لكل منطقةٍ لهجتها وعمارتها ونكهتها الخاصة، جولةٌ سريعة في تنوّعها.</p>
    </div>

    <div class="regions__grid">
      @for (region of regions; track region.id) {
        <article class="region-card">
          <div class="region-card__media">
            <img [src]="region.image" [alt]="region.title" loading="lazy" />
            <div class="region-card__overlay"></div>
            <div class="region-card__caption">
              <h3>{{ region.title }}</h3>
              <p>{{ region.description }}</p>
            </div>
          </div>
        </article>
      }
    </div>
  </div>
</section>
